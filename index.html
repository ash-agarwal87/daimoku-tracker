    // ── Active campaign detector ─────────────────────────────────────
    // Priority: most recently set campaign (last in array), regardless of
    // whether its start date is past or future (within 60 days ahead).
    // Falls back to most recent past campaign, then current calendar month.
    const getActiveCampaign = (campaigns) => {
      const today = new Date(); today.setHours(0,0,0,0);
      const sixtyDaysAhead = new Date(today); sixtyDaysAhead.setDate(today.getDate()+60);

      // Prefer: last entry where startDate is within 60 days ahead OR in the past
      const eligible = campaigns.filter(c => {
        if (!c.startDate) return false;
        const d = new Date(c.startDate + "T00:00:00");
        return d <= sixtyDaysAhead;
      });
      if (eligible.length > 0) {
        // Prefer admin-set dates (day != 1) — take the last one set
        const adminSet = eligible.filter(c => {
          const d = new Date(c.startDate + "T00:00:00");
          return d.getDate() !== 1;
        });
        const best = adminSet.length > 0
          ? adminSet[adminSet.length - 1]
          : eligible[eligible.length - 1];
        const d = new Date(best.startDate + "T00:00:00");
        return { year: d.getFullYear(), month: d.getMonth() };
      }
      const n = new Date();
      return { year: n.getFullYear(), month: n.getMonth() };
    };

    // ── Campaign start date helper ───────────────────────────────────
    const getCampaignStart = (campaigns, y, m) => {
      // Get ALL entries for this month
      const monthMatches = campaigns.filter(c => {
        if (!c.startDate) return false;
        const d = new Date(c.startDate + "T00:00:00");
        return d.getFullYear() === y && d.getMonth() === m;
      });
      if (monthMatches.length === 0) return new Date(y, m, 1);
      // Prefer admin-set dates (day != 1st) — take last one in array (most recently set)
      const adminSet = monthMatches.filter(c => {
        const d = new Date(c.startDate + "T00:00:00");
        return d.getDate() !== 1;
      });
      const best = adminSet.length > 0
        ? adminSet[adminSet.length - 1]   // last admin-set entry
        : monthMatches[monthMatches.length - 1]; // last default entry
      const [sy, sm, sd] = best.startDate.split("-");
      return new Date(parseInt(sy), parseInt(sm)-1, parseInt(sd));
    };

    // Days elapsed since campaign start (capped at today)

      const today = new Date();
      today.setHours(0,0,0,0);
      const start = new Date(startDate);
      start.setHours(0,0,0,0);
      if (start > today) return 0;
      return Math.floor((today - start) / 86400000) + 1;

    function CollectiveMountain({ groupPct, totalMins, groupTarget }) {
      const pctCapped = Math.min(groupPct, 100);

      const WAYPOINTS = [
        { pct: 0,   label: "Base Camp", emoji: "⛺" },
        { pct: 25,  label: "Camp I",    emoji: "🏕️" },
        { pct: 50,  label: "Halfway",   emoji: "🔥" },
        { pct: 75,  label: "Camp III",  emoji: "🌟" },
        { pct: 100, label: "Summit",    emoji: "🪷" },
      ];

      const currentWP = [...WAYPOINTS].reverse().find(w => pctCapped >= w.pct) || WAYPOINTS[0];
      const nextWP    = WAYPOINTS.find(w => w.pct > pctCapped);
      const minsLeft  = Math.max(groupTarget - totalMins, 0).toLocaleString();

      return (
        <div className="mountain-wrap">
          {/* Painting image */}
          <div style={{position:"relative",overflow:"hidden",borderRadius:"16px 16px 0 0"}}>
            <img src={FUJI_IMG} alt="Mount Fuji"
              style={{width:"100%",height:180,objectFit:"cover",objectPosition:"center 30%",display:"block"}}/>
            {/* Dark overlay at bottom for readability */}
            <div style={{position:"absolute",bottom:0,left:0,right:0,height:60,
              background:"linear-gradient(to top,rgba(8,6,20,.85),transparent)"}}/>
            {/* Waypoint pills overlaid on image */}
            <div style={{position:"absolute",bottom:10,left:0,right:0,
              display:"flex",justifyContent:"center",gap:6,flexWrap:"wrap",padding:"0 12px"}}>
              {WAYPOINTS.map((wp,i)=>{
                const reached = pctCapped >= wp.pct;
                return (
                  <span key={i} style={{
                    fontSize:10,padding:"2px 8px",borderRadius:20,
                    background: reached ? "rgba(232,184,75,.25)" : "rgba(0,0,0,.4)",
                    border: `1px solid ${reached ? "rgba(232,184,75,.6)" : "rgba(255,255,255,.15)"}`,
                    color: reached ? "#F5D47A" : "rgba(255,255,255,.35)",
                    fontFamily:"'Raleway',sans-serif",letterSpacing:".05em",
                    transition:"all .3s"
                  }}>
                    {wp.emoji} {wp.label}
                  </span>
                );
              })}
            </div>
          </div>

          {/* Info bar */}
          <div className="mountain-info">
            <div>
              <div className="mountain-label">🗻 {currentWP.emoji} {currentWP.label}</div>
            </div>
            <div className="mountain-pct">{groupPct}%</div>
            <div className="mountain-sub">
              {nextWP
                ? `${minsLeft} mins to ${nextWP.emoji} ${nextWP.label}`
                : "Summit! Nam-Myoho-Renge-Kyo 🪷"}
            </div>
          </div>
        </div>
      );
    }


    // ═════════════════════════════════════════════════════════════════
    //  Chart.js Components
    // ═════════════════════════════════════════════════════════════════

    // Daily bar chart — one bar per day, reference line at 60
    function DailyChart({ data }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !data.length) return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext("2d");
        chartRef.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: data.map(d => d.day),
            datasets: [
              {
                label: "Chanted",
                data: data.map(d => d.mins),
                backgroundColor: data.map(d =>
                  d.mins >= DAILY_TARGET ? "#5BAD8F" : d.mins > 0 ? "#E8B84B" : "rgba(255,255,255,0.07)"
                ),
                borderRadius: 4,
                maxBarThickness: 36,
              },
              {
                label: "60 min target",
                data: data.map(() => DAILY_TARGET),
                type: "line",
                borderColor: "rgba(232,184,75,0.5)",
                borderWidth: 1.5,
                borderDash: [5, 4],
                pointRadius: 0,
                fill: false,
                tension: 0,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(8,6,20,0.95)",
                titleColor: "rgba(232,184,75,0.8)",
                bodyColor: "#EDE8F5",
                borderColor: "rgba(232,184,75,0.3)",
                borderWidth: 1,
                callbacks: {
                  label: ctx => `${ctx.dataset.label}: ${ctx.raw} mins`
                }
              }
            },
            scales: {
              x: {
                grid: { color: "rgba(255,255,255,0.06)" },
                ticks: { color: "rgba(237,232,245,0.4)", font: { size: 10 } }
              },
              y: {
                grid: { color: "rgba(255,255,255,0.06)" },
                ticks: { color: "rgba(237,232,245,0.4)", font: { size: 10 } },
                beginAtZero: true
              }
            }
          }
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [data]);

      return (
        <div style={{ position:"relative", width:"100%", height:190 }}>
          <canvas ref={canvasRef} />
        </div>
      );
    }

    // Group overview — grouped bars: target (ghost) + chanted (coloured) per person
    function GroupChart({ data, nameIndex }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !data.length) return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext("2d");
        chartRef.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: data.map(d => d.shortName),
            datasets: [
              {
                label: "Target",
                data: data.map(d => d.target),
                backgroundColor: "rgba(232,184,75,0.15)",
                borderRadius: 4,
                maxBarThickness: 40,
              },
              {
                label: "Chanted",
                data: data.map(d => d.total),
                backgroundColor: data.map(d => PALETTE[nameIndex(d.fullName) % PALETTE.length] + "DD"),
                borderRadius: 4,
                maxBarThickness: 40,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                labels: { color: "rgba(237,232,245,0.5)", font: { size: 11 }, boxWidth: 12 }
              },
              tooltip: {
                backgroundColor: "rgba(8,6,20,0.95)",
                titleColor: "rgba(232,184,75,0.8)",
                bodyColor: "#EDE8F5",
                borderColor: "rgba(232,184,75,0.3)",
                borderWidth: 1,
                callbacks: {
                  title: items => data[items[0].dataIndex].fullName,
                  label: ctx => `${ctx.dataset.label}: ${ctx.raw.toLocaleString()} mins`
                }
              }
            },
            scales: {
              x: {
                grid: { color: "rgba(255,255,255,0.05)" },
                ticks: { color: "rgba(237,232,245,0.5)", font: { size: 11 } }
              },
              y: {
                grid: { color: "rgba(255,255,255,0.05)" },
                ticks: { color: "rgba(237,232,245,0.5)", font: { size: 10 } },
                beginAtZero: true
              }
            }
          }
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [data]);

      return (
        <div style={{ position:"relative", width:"100%", height:260 }}>
          <canvas ref={canvasRef} />
        </div>
      );
    }

    const NotConfigured = () => (
      <div className="screen">
        <span style={{fontSize:40}}>🪷</span>

    // ═════════════════════════════════════════════════════════════════
    //  Main App
    // ═════════════════════════════════════════════════════════════════
    function DaimokuTracker() {
      const now = new Date();
      const dailyQuote = getDailyQuote();
      const [appState,       setAppState]       = useState("loading");
      const [names,          setNames]          = useState([]);
      const [entries,        setEntries]        = useState([]);
      const [lastUpdated,    setLastUpdated]    = useState(null);
      const [tab,            setTab]            = useState("track");
      const [form,           setForm]           = useState({name:"",date:todayStr(),count:""});
      const [errors,         setErrors]         = useState({});
      const [toast,          setToast]          = useState(null);
      const [submitting,     setSubmitting]     = useState(false);
      const [saving,         setSaving]         = useState(false);
      const [refreshing,     setRefreshing]     = useState(false);
      const [newName,        setNewName]        = useState("");
      const [viewYear,       setViewYear]       = useState(now.getFullYear());
      const [viewMonth,      setViewMonth]      = useState(now.getMonth());
      const [viewMode,       setViewMode]       = useState("mtd");
      const [expandedPerson, setExpandedPerson] = useState(null);
      const [detailTab,      setDetailTab]      = useState("chart");
      // Admin / campaign state
      const [adminUnlocked,  setAdminUnlocked]  = useState(false);
      const [adminPin,       setAdminPin]       = useState("");
      const [pinError,       setPinError]       = useState(false);
      const [campaigns,      setCampaigns]      = useState([]);
      const [campLabel,      setCampLabel]      = useState("");
      const [campDate,       setCampDate]       = useState("");
      const [campSaving,     setCampSaving]     = useState(false);
      const [campMsg,        setCampMsg]        = useState(null);
      const [challenges,     setChallenges]     = useState({}); // {name: 30|45|60}
      const [grExpanded,    setGrExpanded]    = useState(null);
      const [studyData,      setStudyData]      = useState([]);   // array of monthly study entries
      const [studyLoading,   setStudyLoading]   = useState(false);
      const [studyArchive,   setStudyArchive]   = useState(false); // show archive toggle
      // Admin study form
      const [studyForm,      setStudyForm]      = useState({
        month:"", accent:"gold", title:"", intro:"",
        bullets:"", quote:"", quoteAuthor:"— Daisaku Ikeda", reflection:""
      });
      const [studySaving,    setStudySaving]    = useState(false);
      const [studyMsg,       setStudyMsg]       = useState(null);
      const [timeTheme,      setTimeTheme]      = useState(getTimeTheme());
      const [confetti,       setConfetti]       = useState([]);
      const [dashKey,        setDashKey]        = useState(0); // remount animations on tab switch

      // Update time theme every minute
      useEffect(()=>{
        const t = setInterval(()=>setTimeTheme(getTimeTheme()), 60000);
        return ()=>clearTimeout(t);
      },[]);

      // Confetti burst
      const burstConfetti = () => {
        const dots = Array.from({length:18},(_,i)=>({
          id:Date.now()+i,
          left: Math.random()*100,
          color: ['#E8B84B','#5BAD8F','#9B6CC4','#5E9BBF','#E06B75'][i%5],
          size: 6+Math.random()*8,
          delay: Math.random()*0.6,
        }));
        setConfetti(dots);
        setTimeout(()=>setConfetti([]),2500);
      };
      const [grParable,      setGrParable]      = useState(false);
      const toastRef = useRef(null);
      const [theme, setTheme] = useState("afternoon");
      const [milestone, setMilestone] = useState(null);
      const [prevGroupPct, setPrevGroupPct] = useState(0);

      // Time of day theme
      useEffect(() => {
        const h = new Date().getHours();
        if (h >= 5  && h < 12) setTheme("morning");
        else if (h >= 12 && h < 17) setTheme("afternoon");
        else if (h >= 17 && h < 21) setTheme("evening");
        else setTheme("night");
      }, []);

      const themeLabel = {"morning":"🌅 Morning","afternoon":"☀️ Afternoon","evening":"🌆 Evening","night":"🌙 Night"}[theme]||"";

      // Entrance animations handled by pure CSS @keyframes — no JS needed

      // Milestone detection
      useEffect(() => {
        const gp = pct(totalMins, groupMtdTarget||1);
        if (prevGroupPct < 50  && gp >= 50)  setMilestone({pct:50,  msg:"Halfway there! The Law is moving. 🔥"});
        if (prevGroupPct < 75  && gp >= 75)  setMilestone({pct:75,  msg:"75% achieved — the Zadankai can feel it! 🪷"});
        if (prevGroupPct < 100 && gp >= 100) setMilestone({pct:100, msg:"District target reached! Nam-Myoho-Renge-Kyo! 🎉"});
        setPrevGroupPct(gp);
      }, [totalMins, groupMtdTarget]);

      const showToast = (msg, type="success") => {
        setToast({msg,type});
        clearTimeout(toastRef.current);
        toastRef.current = setTimeout(()=>setToast(null), 4000);
      };

      const loadData = useCallback(async (isRefresh=false) => {
        if (isRefresh) setRefreshing(true); else setAppState("loading");
        try {
          const d = await api.getData();
          if (!d.ok) throw new Error(d.error||"API returned error");
          setNames(d.names||[]);
          setEntries(d.entries||[]);
          setLastUpdated(new Date());
          setAppState("ready");
          // Load per-person challenges
          try {
            const ch = await api.getChallenges();
            if (ch.ok) setChallenges(ch.challenges||{});
          } catch(e) {}
          // Load study material
          try {
            const sd = await api.getStudy();
            if (sd.ok) setStudyData(sd.entries||[]);
          } catch(e) {}
          // Load campaign dates — auto-navigate to active campaign
          try {
            const cd = await api.getCampaignDates();
            if (cd.ok) {
              const camps = cd.campaigns||[];
              setCampaigns(camps);
              if (camps.length > 0) {
                const active = getActiveCampaign(camps);
                setViewYear(active.year);
                setViewMonth(active.month);
              }
            }
          } catch(e) {}
        } catch(e) {
          if (!isRefresh) setAppState("error");
          else showToast("Refresh failed — "+e.message, "error");
        } finally {
          setRefreshing(false);
        }
      }, []);

      useEffect(()=>{
        if (API_URL==="YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") { setAppState("not-configured"); return; }
        loadData();
      },[]);

      const loadCampaigns = useCallback(async () => {
        try {
          const d = await api.getCampaignDates();
          if (d.ok) setCampaigns(d.campaigns||[]);
        } catch(e) {}
      }, []);

      useEffect(() => { if (adminUnlocked) loadCampaigns(); }, [adminUnlocked]);

      const handleAdminUnlock = () => {
        // PIN is verified server-side — just try a dummy call to check
        setPinError(false);
        // We'll verify on save; just unlock UI optimistically
        if (adminPin.trim() === "") { setPinError(true); return; }
        setAdminUnlocked(true);
        loadCampaigns();
      };

      const handleSetCampaignDate = async () => {
        if (!campLabel || !campDate) { setCampMsg({msg:"Select month and date",type:"error"}); return; }
        setCampSaving(true); setCampMsg(null);
        try {
          const r = await api.setCampaignDate(campLabel, campDate, adminPin);
          if (!r.ok) throw new Error(r.error||"Failed");
          setCampMsg({msg:"✅ Campaign start date updated: "+campLabel+" → "+campDate, type:"success"});
          // Immediately navigate to the month that was just saved
          const savedDate = new Date(campDate + "T00:00:00");
          setViewYear(savedDate.getFullYear());
          setViewMonth(savedDate.getMonth());
          // Refresh campaigns list
          const cd = await api.getCampaignDates();
          if (cd.ok) setCampaigns(cd.campaigns||[]);
          setCampDate("");
        } catch(err) {
          if (err.message.includes("PIN")) { setAdminUnlocked(false); setPinError(true); }
          setCampMsg({msg:"Error: "+err.message, type:"error"});
        } finally { setCampSaving(false); }
      };

      // Generate next 12 month labels
      const monthOptions = Array.from({length:12},(_,i) => {
        const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
        return d.toLocaleString("en-US",{month:"long",year:"numeric"});
      });

      const handleSubmit = async () => {
        const e={};
        if (!form.name) e.name="Please select your name";
        if (!form.date) e.date="Please select a date";
        const n=Number(form.count);
        if (!form.count||!Number.isInteger(n)||n<=0) e.count="Enter a whole number greater than 0";
        if (Object.keys(e).length){setErrors(e);return;}
        setSubmitting(true);
        try {
          const personChallenge=challenges[form.name]||60;
          const r=await api.addEntry({name:form.name,date:form.date,count:parseInt(form.count),challenge:personChallenge});
          if (!r.ok) throw new Error(r.error||"Save failed");
          setEntries(prev=>[...prev,{id:r.id||Date.now(),name:form.name,date:form.date,count:parseInt(form.count),challenge:personChallenge}]);
          setForm({name:"",date:todayStr(),count:""});
          setErrors({});
          showToast(SUBMIT_MESSAGES[Math.floor(Math.random()*SUBMIT_MESSAGES.length)]);
          // Burst confetti if person just hit 100%
          setTimeout(()=>{
            const p = getPersonStats(form.name, names.indexOf(form.name));
            if (pct(p.total, p.target) >= 100) burstConfetti();
          }, 500);
        } catch(err){ showToast("Could not save — "+err.message,"error"); }
        finally { setSubmitting(false); }
      };

      const handleSaveNames = async newNames => {
        setNames(newNames); setSaving(true);
        try {
          const r=await api.saveNames(newNames);
          if (!r.ok) throw new Error(r.error||"Sync failed");
        } catch(err){ showToast("Names updated locally but failed to sync — "+err.message,"error"); }
        finally { setSaving(false); }
      };

      // Dashboard calculations
      const getPersonStats = useCallback((name,idx)=>{
        const color=PALETTE[idx%PALETTE.length];
        let mine,target,elapsed,campaignStart,firstEntryDate=null;

        // Personal target — use stored challenge, fall back to latest entry's challenge
        const allMine=entries.filter(e=>e.name===name);
        const latestEntry=[...allMine].sort((a,b)=>b.date.localeCompare(a.date))[0];
        const personalTarget=challenges[name]||(latestEntry&&[30,45,60].includes(latestEntry.challenge)?latestEntry.challenge:60);

        if (viewMode==="mtd"){
          campaignStart=getCampaignStart(campaigns,viewYear,viewMonth);
          elapsed=daysElapsedFromStart(campaignStart);
          const todayFilter=new Date(); todayFilter.setHours(0,0,0,0);
          const endOfViewMonth=new Date(viewYear,viewMonth+1,0); // last day of view month
          const cutoff=endOfViewMonth<todayFilter?endOfViewMonth:todayFilter;
          mine=allMine.filter(e=>{
            const d=new Date(e.date+"T00:00:00");
            return d>=campaignStart && d<=cutoff;
          });
          target=elapsed*personalTarget;
        } else {
          // ALL TIME — record of what was done, no pledge target
          mine=allMine;
          if (mine.length>0){
            const sorted=[...mine].sort((a,b)=>a.date.localeCompare(b.date));
            firstEntryDate=new Date(sorted[0].date+"T00:00:00");
            firstEntryDate.setHours(0,0,0,0);
            const today=new Date(); today.setHours(0,0,0,0);
            elapsed=Math.floor((today-firstEntryDate)/86400000)+1;
          } else {
            elapsed=0;
          }
          target=0; // no target for all-time — pledge varies month to month
          campaignStart=firstEntryDate||new Date(0);
        }
        return {name,color,total:mine.reduce((s,e)=>s+e.count,0),target,elapsed,entries:mine,personalTarget,campaignStart,firstEntryDate};
      },[entries,viewYear,viewMonth,viewMode,campaigns,challenges]);

      const allPersonData=names.map((n,i)=>getPersonStats(n,i));
      const totalMins=allPersonData.reduce((s,p)=>s+p.total,0);
      const totalTarget=allPersonData.reduce((s,p)=>s+p.target,0);
      const onTrack=allPersonData.filter(p=>pct(p.total,p.target)>=80).length;
      // Weighted average daily pledge across all members
      const activeMembersCount=allPersonData.filter(p=>p.personalTarget>0).length||1;
      const weightedAvgPledge=Math.round(allPersonData.reduce((s,p)=>s+p.personalTarget,0)/activeMembersCount);
      // Group MTD target = sum of all individual targets
      const groupMtdTarget=totalTarget;
      const campStart=getCampaignStart(campaigns,viewYear,viewMonth);
      const elapsed=viewMode==="mtd"?daysElapsedFromStart(campStart):0; // all-time elapsed is per-person
      const isCurrent=viewYear===now.getFullYear()&&viewMonth===now.getMonth();
      // Allow navigation one month ahead so admins can preview upcoming campaigns
      const nextAllowed = new Date(viewYear, viewMonth+1) <= new Date(now.getFullYear(), now.getMonth()+1);

      const prevMonth=()=>{if(viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1);setExpandedPerson(null);};
      const nextMonth=()=>{if(!nextAllowed)return;if(viewMonth===11){setViewYear(y=>y+1);setViewMonth(0);}else setViewMonth(m=>m+1);setExpandedPerson(null);};

      const getDailyData=useCallback(pEntries=>{
        if (viewMode==="alltime"){
          const g={};pEntries.forEach(e=>{g[e.date]=(g[e.date]||0)+e.count;});
          return Object.entries(g).sort(([a],[b])=>a.localeCompare(b)).map(([date,mins])=>({day:fmtDate(date),mins}));
        }
        const g={};pEntries.forEach(e=>{g[e.date]=(g[e.date]||0)+e.count;});
        const cs=getCampaignStart(campaigns,viewYear,viewMonth);
        return Array.from({length:elapsed},(_,i)=>{
          const dd=new Date(cs); dd.setDate(dd.getDate()+i);
          const ds=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
          return {day:dd.getDate(),mins:g[ds]||0};
        });
      },[viewMode,viewYear,viewMonth,elapsed]);

                        border:"1px solid rgba(232,184,75,.1)",borderRadius:12}}>
                        <div style={{width:32,height:32,borderRadius:"50%",
                          background:PALETTE[i%PALETTE.length],display:"flex",
                          alignItems:"center",justifyContent:"center",fontSize:10,
                          fontWeight:700,color:"#080614",fontFamily:"Cinzel,serif",flexShrink:0}}>
                          {initials(n)}
                        </div>
                        <div style={{flex:1,fontSize:13,fontWeight:500}}>{n}</div>
                        <div style={{display:"flex",gap:6}}>
                          {[60,45,30].map(c=>(
                            <button key={c}
                              onClick={async()=>{
                                setChallenges(prev=>({...prev,[n]:c}));
                                try{ await api.setChallenge(n,c); }
                                catch(e){ showToast("Could not sync challenge","error"); }
                              }}
                              style={{padding:"5px 11px",borderRadius:20,
                                border:`1px solid ${(challenges[n]||60)===c?"#E8B84B":"rgba(232,184,75,.2)"}`,
                                background:(challenges[n]||60)===c?"rgba(232,184,75,.15)":"transparent",
                                color:(challenges[n]||60)===c?"#F5D47A":"rgba(237,232,245,.4)",
                                fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:(challenges[n]||60)===c?700:400,
                                cursor:"pointer",transition:"all .18s",letterSpacing:".08em"}}>
                              {c}m
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="sec">Manage Names</div>
                  <div className="nlist">
                    {names.map((n,i)=>(
                      <div key={n} className="ni">
                        <span>
                          <span style={{width:28,height:28,borderRadius:"50%",background:PALETTE[i%PALETTE.length],display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#080614",fontFamily:"Cinzel,serif",flexShrink:0}}>{initials(n)}</span>
                          {n}
                        </span>
                        <button className="rbtn" onClick={()=>handleSaveNames(names.filter(x=>x!==n))}>✕</button>
                      </div>
                    ))}
                  </div>
                  <div className="arow">
                    <input type="text" placeholder="Add a name…" value={newName} onChange={e=>setNewName(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"){const t=newName.trim();if(t&&!names.includes(t)){handleSaveNames([...names,t]);setNewName("");}}}} />
                    <button className="abtn" onClick={()=>{const t=newName.trim();if(t&&!names.includes(t)){handleSaveNames([...names,t]);setNewName("");}}}>+ Add</button>
                  </div>
                  {toast&&<div className={`toast ${toast.type}`} style={{marginTop:14}}>{toast.msg}</div>}
                </div>
              )}

              {/* ══ CAMPAIGN ADMIN ══ */}
              {tab==="admin" && (
                <div className="card">
                  <div className="sec">Campaign Start Date 🔒</div>

                  {!adminUnlocked ? (
                    /* PIN gate */
                    <div style={{maxWidth:340,margin:"0 auto",textAlign:"center"}}>
                      <div style={{fontSize:13,color:"rgba(237,232,245,.5)",marginBottom:20,lineHeight:1.7}}>
                        This section is admin-only.<br/>Enter your PIN to continue.
                      </div>
                      <div className="fl" style={{marginBottom:14,textAlign:"left"}}>
                        <label>Admin PIN</label>
                        <input className="fi" type="password" placeholder="Enter PIN" value={adminPin}
                          onChange={e=>{setAdminPin(e.target.value);setPinError(false);}}
                          onKeyDown={e=>e.key==="Enter"&&handleAdminUnlock()}
                          style={{letterSpacing:"0.3em",textAlign:"center"}} />
                        {pinError&&<div className="err">⚠ Incorrect PIN</div>}
                      </div>
                      <button className="sbtn" onClick={handleAdminUnlock} style={{marginTop:0}}>Unlock 🔓</button>
                    </div>
                  ) : (
                    /* Campaign date editor */
                    <>
                      <div style={{fontSize:12,color:"rgba(237,232,245,.4)",marginBottom:20,lineHeight:1.7}}>
                        Set the start date for any campaign month. The dashboard calculates days elapsed and target minutes from this date.
                      </div>

                      <div className="fg" style={{maxWidth:420}}>
                        <div className="fl">
                          <label>Campaign Month</label>
                          <select className="fi" value={campLabel} onChange={e=>setCampLabel(e.target.value)}>
                            <option value="">— Select month —</option>
                            {monthOptions.map(m=><option key={m} value={m}>{m}</option>)}
                          </select>
                        </div>
                        <div className="fl">
                          <label>Campaign Start Date</label>
                          <input className="fi" type="date" value={campDate} onChange={e=>setCampDate(e.target.value)} />
                        </div>
                        <button className="sbtn" disabled={campSaving} onClick={handleSetCampaignDate} style={{marginTop:4}}>
                          {campSaving?"Saving…":"Save Campaign Start Date"}
                        </button>
                        {campMsg&&<div className={`toast ${campMsg.type}`}>{campMsg.msg}</div>}
                      </div>

                      {campaigns.length>0&&(
                        <>
                          <div style={{height:1,background:"rgba(232,184,75,.12)",margin:"24px 0"}}/>
                          <div className="sec">Current Campaign Dates</div>
                          <table className="etbl">
                            <thead><tr><th>Month</th><th>Start Date</th></tr></thead>
                            <tbody>
                              {campaigns.map(c=>(
                                <tr key={c.label}>
                                  <td>{c.label}</td>
                                  <td style={{color:"#F5D47A"}}>{c.startDate ? new Date(c.startDate+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—"}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                          <div style={{marginTop:14}}>
                            <button onClick={()=>{setAdminUnlocked(false);setAdminPin("");}} style={{background:"none",border:"1px solid rgba(224,107,117,.3)",borderRadius:8,color:"rgba(224,107,117,.6)",padding:"6px 14px",fontSize:11,cursor:"pointer",fontFamily:"Raleway,sans-serif"}}>
                              🔒 Lock Admin
                            </button>
                          </div>
                          <div style={{height:1,background:"rgba(232,184,75,.12)",margin:"24px 0"}}/>
                          {/* ── Study Material Editor ── */}
                          <div className="sec">📚 Monthly Study Material</div>
                          <div style={{fontSize:12,color:"rgba(237,232,245,.4)",marginBottom:16,lineHeight:1.7}}>
                            Add this month's study content. Appears in the 📚 Study tab for all members.
                          </div>
                          <div className="fg" style={{maxWidth:520}}>
                            <div className="fl">
                              <label>Month</label>
                              <select className="fi" value={studyForm.month} onChange={e=>setStudyForm(f=>({...f,month:e.target.value}))}>
                                <option value="">— Select month —</option>
                                {monthOptions.map(m=><option key={m} value={m}>{m}</option>)}
                              </select>
                            </div>
                            <div className="fl">
                              <label>Accent Colour</label>
                              <div className="accent-picker">
                                {[["gold","#E8B84B"],["purple","#9B6CC4"],["green","#5BAD8F"],["blue","#5E9BBF"],["rose","#E06B75"]].map(([k,col])=>(
                                  <div key={k} className={"accent-opt"+(studyForm.accent===k?" selected":"")}
                                    style={{background:col}} onClick={()=>setStudyForm(f=>({...f,accent:k}))}/>
                                ))}
                                <span style={{fontSize:11,color:"rgba(237,232,245,.35)",marginLeft:4}}>Sets card colour</span>
                              </div>
                            </div>
                            <div className="fl">
                              <label>Study Title</label>
                              <input className="fi" type="text" placeholder="e.g. The Four Debts of Gratitude"
                                value={studyForm.title} onChange={e=>setStudyForm(f=>({...f,title:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Introduction</label>
                              <textarea className="study-textarea" placeholder="A brief intro to the study topic..."
                                value={studyForm.intro} onChange={e=>setStudyForm(f=>({...f,intro:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Key Points (one per line, start each with -)</label>
                              <textarea className="study-textarea" style={{minHeight:120}}
                                placeholder="- First key point"
                                value={studyForm.bullets} onChange={e=>setStudyForm(f=>({...f,bullets:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Key Quote</label>
                              <textarea className="study-textarea" style={{minHeight:70}}
                                placeholder="The quote to highlight..."
                                value={studyForm.quote} onChange={e=>setStudyForm(f=>({...f,quote:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Quote Attribution</label>
                              <input className="fi" type="text" placeholder="— Daisaku Ikeda"
                                value={studyForm.quoteAuthor} onChange={e=>setStudyForm(f=>({...f,quoteAuthor:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Reflection Question</label>
                              <textarea className="study-textarea" style={{minHeight:70}}
                                placeholder="A question for members to sit with..."
                                value={studyForm.reflection} onChange={e=>setStudyForm(f=>({...f,reflection:e.target.value}))}/>
                            </div>
                            <button className="sbtn" disabled={studySaving} onClick={async()=>{
                              if (!studyForm.month||!studyForm.title){setStudyMsg({msg:"Month and title required",type:"error"});return;}
                              setStudySaving(true);setStudyMsg(null);
                              try {
                                const r=await api.saveStudy(studyForm);
                                if (!r.ok) throw new Error(r.error||"Save failed");
                                setStudyData(prev=>[...prev.filter(s=>s.month!==studyForm.month),{...studyForm}]
                                  .sort((a,b)=>new Date("1 "+a.month)-new Date("1 "+b.month)));
                                setStudyMsg({msg:"✅ Study material saved for "+studyForm.month,type:"success"});
                                setStudyForm(f=>({...f,title:"",intro:"",bullets:"",quote:"",quoteAuthor:"— Daisaku Ikeda",reflection:""}));
                              } catch(err){setStudyMsg({msg:"Error: "+err.message,type:"error"});}
                              finally{setStudySaving(false);}
                            }}>{studySaving?"Saving…":"Save Study Material"}</button>
                            {studyMsg&&<div className={"toast "+studyMsg.type}>{studyMsg.msg}</div>}
                          </div>
                        </>
                      )}
                    </>
                  )}
                </div>
              )}

            </div>
            {saving&&<div className="save-overlay"><span className="spin" style={{fontSize:14}}>🪷</span> Syncing…</div>}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<DaimokuTracker />);
  </script>
</body>
</html>
