<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet" />
  <!-- React 18 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ─────────────────────────────────────────────────────────────────
    //  ⚙️  PASTE YOUR APPS SCRIPT WEB APP URL BELOW
    // ─────────────────────────────────────────────────────────────────
    const API_URL = "https://script.google.com/macros/s/AKfycbwmyeqENA9uC8xO_HvvtWdYBkPLiOw3lWa7Qg1ckt-VdjEd-ACn_uEHfmzSGCy7dDORGg/exec";
    // ─────────────────────────────────────────────────────────────────

    const { useState, useEffect, useCallback, useRef } = React;

    // ── Constants ────────────────────────────────────────────────────
    const DAILY_TARGET = 60;
    const IKEDA_QUOTE  = "Each of us has within us a sun — a luminous, inextinguishable life force. When you chant, you are not calling upon something outside yourself. You are awakening what has always been there.";
    const PALETTE      = ["#E8B84B","#C97D3A","#9B6CC4","#5E9BBF","#E06B75","#5BAD8F","#D4795C","#7B8BD4","#B07DB8","#4BADB8"];

    // ── Rotating Quotes ─────────────────────────────────────────────
    const DAILY_QUOTES = [
      {text:"A great human revolution in just a single individual will help achieve a change in the destiny of a nation and, further, of all humanity.", attr:"— Daisaku Ikeda"},
      {text:"Difficulties are not obstacles to our practice — they are the practice itself.", attr:"— Daisaku Ikeda"},
      {text:"The heart of Buddhism is the conviction that we have within us, at each moment, the ability to transform our situation.", attr:"— Daisaku Ikeda"},
      {text:"When you chant, you are not calling upon something outside yourself. You are awakening what has always been there.", attr:"— Daisaku Ikeda"},
      {text:"Gratitude is a source of fundamental human strength. It is the starting point of action, not the conclusion of it.", attr:"— Daisaku Ikeda"},
      {text:"The practice of chanting Nam-myoho-renge-kyo is itself the act of making one's life shine with the brilliance of the Mystic Law.", attr:"— Daisaku Ikeda"},
      {text:"Faith means valuing each person's Buddha nature without exception. It means refusing to give up on anyone.", attr:"— Daisaku Ikeda"},
      {text:"Those who chant Nam-myoho-renge-kyo and feel its rhythm in their hearts will eventually develop the strength to face any storm.", attr:"— Daisaku Ikeda"},
      {text:"It is not our circumstances that define us — it is the depth of life condition from which we meet them.", attr:"— Daisaku Ikeda"},
      {text:"Difficulties faced in faith and resolved through faith are not obstacles but opportunities to deepen our lives.", attr:"— Daisaku Ikeda"},
    ];

    const SUBMIT_MESSAGES = [
      "✨ Beautifully done. Your daimoku has been recorded.",
      "🪷 The Gohonzon heard that. Every minute counts.",
      "🔥 That session just moved something. Keep going.",
      "✨ Nam-Myoho-Renge-Kyo. Filed. The universe noted it.",
      "🌟 The district grows stronger with every minute you chant.",
      "🪷 Well done. One more session in the book. The mountain gets closer.",
      "✨ Each daimoku is a letter to the Mystic Law. This one was sent.",
      "🔥 That's the practice. Show up, chant, repeat. You're doing it.",
      "🌿 Something in the world just shifted because of that session.",
      "🪷 Received. Your intention carries further than you know.",
    ];

    // Quote of the day — cycles daily, consistent for all viewers on same day
    const getDailyQuote = () => {
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
      return DAILY_QUOTES[dayOfYear % DAILY_QUOTES.length];
    };

    const DEBTS = [
      {num:"I",  en:"All Living Beings",  icon:"🌍", color:"#E8B84B", glow:"rgba(232,184,75,0.18)",
        reflection:"Everything in the universe is interdependent. Our very existence is sustained by countless people and forces we never see — the farmer, the rain, the stranger who held a door. A debt so vast it can never be fully named.",
        chant:"As I chant, I send the vibration of the Mystic Law to every living being — seen and unseen — who holds my life up."},
      {num:"II", en:"Father & Mother",    icon:"👨‍👩‍👦", color:"#C97D3A", glow:"rgba(201,125,58,0.18)",
        reflection:"They brought us into this world and worked hard to raise us. The simplest debt — and perhaps the one we most take for granted. Before we could choose, someone chose us. Before we could ask, someone gave.",
        chant:"As I chant, I honour what was given before I could even ask for it — and I vow to become someone worth that gift."},
      {num:"III",en:"Sovereign & Country",icon:"🏛️", color:"#9B6CC4", glow:"rgba(155,108,196,0.18)",
        reflection:"We live on this land, breathe this air, draw on its resources. There is a quiet debt in simply being here — in the roads we walk, the laws that protect us, the society that makes community possible.",
        chant:"As I chant, I pray for righteous governance — and I commit to being a force for good within my own sphere."},
      {num:"IV", en:"The Three Treasures",icon:"☸️", color:"#5BAD8F", glow:"rgba(91,173,143,0.18)",
        reflection:"The Gohonzon, the Daishonin's teachings, and the Soka Gakkai — our community, right here. This debt is repaid not by ritual but by advancing kosen-rufu. Every dialogue, every time we support a fellow member — that counts.",
        chant:"As I chant, I carry the torch forward — and I vow that through my life, the Law will reach someone new."},
    ];
    const GRATITUDE_POEM = `The one who saved me, may not always be found,
So I tend to all who share this ground.
The debt I owe to a single grace —
repaid in every living face.`;

    // ── Helpers ──────────────────────────────────────────────────────
    const todayStr    = () => new Date().toISOString().split("T")[0];
    const monthLabel  = (y, m) => new Date(y, m).toLocaleString("default", { month:"long", year:"numeric" });
    const daysElapsed = (y, m) => {
      const n = new Date();
      return (n.getFullYear()===y && n.getMonth()===m) ? n.getDate() : new Date(y,m+1,0).getDate();
    };
    const pct         = (a, b) => b===0 ? 0 : Math.round((a/b)*100);
    const initials    = n => n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
    const fmtDate     = ds => { const [y,m,d]=ds.split("-"); return `${d}/${m}/${y}`; };
    const statusColor = (a, t) => { const r=pct(a,t); return r>=80?"#5BAD8F":r>=50?"#E8B84B":"#E06B75"; };
    const statusLabel = (a, t) => { const r=pct(a,t); return r>=80?"✅ On Track":r>=50?"⚡ Catching Up":"🔴 Needs Push"; };

    // ── API ───────────────────────────────────────────────────────────
    const api = {
      async getData() {
        const r = await fetch(`${API_URL}?action=getData`, { redirect:"follow" });
        return r.json();
      },
      async addEntry(entry) {
        const r = await fetch(
          `${API_URL}?action=addEntry&data=${encodeURIComponent(JSON.stringify(entry))}`,
          { redirect:"follow" }
        );
        return r.json();
      },
      async saveNames(names) {
        const r = await fetch(
          `${API_URL}?action=saveNames&data=${encodeURIComponent(JSON.stringify({names}))}`,
          { redirect:"follow" }
        );
        return r.json();
      },
      async getCampaignDates() {
        const r = await fetch(`${API_URL}?action=getCampaignDates`, { redirect:"follow" });
        return r.json();
      },
      async setCampaignDate(label, startDate, pin) {
        const r = await fetch(
          `${API_URL}?action=setCampaignDate&data=${encodeURIComponent(JSON.stringify({label,startDate,pin}))}`,
          { redirect:"follow" }
        );
        return r.json();
      },
      async getChallenges() {
        const r = await fetch(`${API_URL}?action=getChallenges`, { redirect:"follow" });
        return r.json();
      },
      async setChallenge(name, challenge) {
        const r = await fetch(
          `${API_URL}?action=setChallenge&data=${encodeURIComponent(JSON.stringify({name,challenge}))}`,
          { redirect:"follow" }
        );
        return r.json();
      },
      async getStudy() {
        const r = await fetch(`${API_URL}?action=getStudy`, { redirect:"follow" });
        return r.json();
      },
      async saveStudy(data) {
        const r = await fetch(
          `${API_URL}?action=saveStudy&data=${encodeURIComponent(JSON.stringify(data))}`,
          { redirect:"follow" }
        );
        return r.json();
      }
    };

    // ── Campaign start date helper ───────────────────────────────────
    const getCampaignStart = (campaigns, y, m) => {
      // Get ALL entries for this month
      const monthMatches = campaigns.filter(c => {
        if (!c.startDate) return false;
        const d = new Date(c.startDate + "T00:00:00");
        return d.getFullYear() === y && d.getMonth() === m;
      });
      if (monthMatches.length === 0) return new Date(y, m, 1);
      // Prefer admin-set dates (day != 1st) — take last one in array (most recently set)
      const adminSet = monthMatches.filter(c => {
        const d = new Date(c.startDate + "T00:00:00");
        return d.getDate() !== 1;
      });
      const best = adminSet.length > 0
        ? adminSet[adminSet.length - 1]   // last admin-set entry
        : monthMatches[monthMatches.length - 1]; // last default entry
      const [sy, sm, sd] = best.startDate.split("-");
      return new Date(parseInt(sy), parseInt(sm)-1, parseInt(sd));
    };

    // Days elapsed since campaign start (capped at today)
    const daysElapsedFromStart = (startDate) => {
      const today = new Date();
      today.setHours(0,0,0,0);
      const start = new Date(startDate);
      start.setHours(0,0,0,0);
      if (start > today) return 0;
      return Math.floor((today - start) / 86400000) + 1;
    };

    // ═════════════════════════════════════════════════════════════════
    //  Collective Mountain Component
    // ═════════════════════════════════════════════════════════════════
    function CollectiveMountain({ groupPct, totalMins, groupTarget }) {
      const pctCapped = Math.min(groupPct, 100);

      // Mountain waypoints: base(100%), camp1(75%), camp2(50%), camp3(25%), summit(0%)
      // SVG coords: summit at top, base at bottom
      const WAYPOINTS = [
        { pct: 0,   y: 98,  label: "Base Camp",  emoji: "⛺" },
        { pct: 25,  y: 78,  label: "Camp I",      emoji: "🏕️" },
        { pct: 50,  y: 55,  label: "Halfway",     emoji: "🔥" },
        { pct: 75,  y: 32,  label: "Camp III",    emoji: "🌟" },
        { pct: 100, y: 10,  label: "Summit",      emoji: "🪷" },
      ];

      // Interpolate marker Y position based on group %
      const getMarkerY = (pct) => {
        for (let i = 0; i < WAYPOINTS.length - 1; i++) {
          const lo = WAYPOINTS[i], hi = WAYPOINTS[i+1];
          if (pct >= lo.pct && pct <= hi.pct) {
            const t = (pct - lo.pct) / (hi.pct - lo.pct);
            return lo.y + (hi.y - lo.y) * t;
          }
        }
        return WAYPOINTS[WAYPOINTS.length-1].y;
      };

      const markerY = getMarkerY(pctCapped);
      const markerX = 50; // centre of SVG

      // Snow line — appears above 75%
      const snowOpacity = pctCapped >= 75 ? Math.min((pctCapped - 75) / 25, 1) : 0;

      // Current waypoint label
      const currentWP = [...WAYPOINTS].reverse().find(w => pctCapped >= w.pct) || WAYPOINTS[0];
      const nextWP    = WAYPOINTS.find(w => w.pct > pctCapped);

      return (
        <div className="mountain-wrap">
          <div className="mountain-label">🏔️ District Mountain — {currentWP.emoji} {currentWP.label}</div>
          <svg className="mountain-svg" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
            {/* Sky gradient */}
            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#0a0820" stopOpacity="1"/>
                <stop offset="100%" stopColor="#1a1440" stopOpacity="1"/>
              </linearGradient>
              <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4a3a6a"/>
                <stop offset="60%" stopColor="#2a2040"/>
                <stop offset="100%" stopColor="#1a1430"/>
              </linearGradient>
              <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#ffffff" stopOpacity={0.9 * snowOpacity}/>
                <stop offset="100%" stopColor="#c8d8f0" stopOpacity={0.4 * snowOpacity}/>
              </linearGradient>
              <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#E8B84B"/>
                <stop offset="100%" stopColor="#C97D3A"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            {/* Background */}
            <rect width="100" height="110" fill="url(#skyGrad)"/>

            {/* Stars */}
            {[[15,8],[30,5],[70,12],[85,7],[92,20],[8,25],[55,4],[40,18]].map(([x,y],i)=>(
              <circle key={i} cx={x} cy={y} r="0.4"
                fill="white" opacity={0.3+Math.sin(i*1.3)*0.3}/>
            ))}

            {/* Mountain body */}
            <polygon points="50,8 12,102 88,102" fill="url(#mountainGrad)"/>

            {/* Snow cap */}
            <polygon points="50,8 38,32 62,32" fill="url(#snowGrad)"/>

            {/* Waypoint dots */}
            {WAYPOINTS.map((wp,i) => {
              const wx = 50 + (i % 2 === 0 ? 0 : (i%4===1?8:-8));
              const reached = pctCapped >= wp.pct;
              return (
                <g key={i}>
                  <circle cx={wx} cy={wp.y} r="1.8"
                    fill={reached?"#E8B84B":"rgba(255,255,255,0.15)"}
                    stroke={reached?"#F5D47A":"rgba(255,255,255,0.2)"}
                    strokeWidth="0.5"
                    filter={reached?"url(#glow)":"none"}/>
                  <text x={wx+(wx>50?3:-3)} y={wp.y+0.6}
                    fontSize="3.5" fill="rgba(237,232,245,0.5)"
                    textAnchor={wx>50?"start":"end"}>{wp.emoji}</text>
                </g>
              );
            })}

            {/* Climber marker */}
            <g className="camp-marker" style={{transform:`translateY(${markerY-50}px)`}}>
              <circle cx={markerX} cy="50" r="3"
                fill="#E8B84B" stroke="#F5D47A" strokeWidth="0.8"
                filter="url(#glow)" opacity="0.95"/>
              <text x={markerX} y="52" fontSize="4"
                textAnchor="middle" fill="white">🧗</text>
            </g>
          </svg>

          <div className="mountain-pct">{groupPct}%</div>
          <div className="mountain-sub">
            {nextWP
              ? `${groupTarget-totalMins > 0 ? (groupTarget-totalMins).toLocaleString() : 0} mins to ${nextWP.emoji} ${nextWP.label}`
              : "Summit reached! Nam-Myoho-Renge-Kyo 🪷"}
          </div>
        </div>
      );
    }

    // ═════════════════════════════════════════════════════════════════
    //  Chart.js Components
    // ═════════════════════════════════════════════════════════════════

    // Daily bar chart — one bar per day, reference line at 60
    function DailyChart({ data }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !data.length) return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext("2d");
        chartRef.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: data.map(d => d.day),
            datasets: [
              {
                label: "Chanted",
                data: data.map(d => d.mins),
                backgroundColor: data.map(d =>
                  d.mins >= DAILY_TARGET ? "#5BAD8F" : d.mins > 0 ? "#E8B84B" : "rgba(255,255,255,0.07)"
                ),
                borderRadius: 4,
                maxBarThickness: 36,
              },
              {
                label: "60 min target",
                data: data.map(() => DAILY_TARGET),
                type: "line",
                borderColor: "rgba(232,184,75,0.5)",
                borderWidth: 1.5,
                borderDash: [5, 4],
                pointRadius: 0,
                fill: false,
                tension: 0,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(8,6,20,0.95)",
                titleColor: "rgba(232,184,75,0.8)",
                bodyColor: "#EDE8F5",
                borderColor: "rgba(232,184,75,0.3)",
                borderWidth: 1,
                callbacks: {
                  label: ctx => `${ctx.dataset.label}: ${ctx.raw} mins`
                }
              }
            },
            scales: {
              x: {
                grid: { color: "rgba(255,255,255,0.06)" },
                ticks: { color: "rgba(237,232,245,0.4)", font: { size: 10 } }
              },
              y: {
                grid: { color: "rgba(255,255,255,0.06)" },
                ticks: { color: "rgba(237,232,245,0.4)", font: { size: 10 } },
                beginAtZero: true
              }
            }
          }
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [data]);

      return (
        <div style={{ position:"relative", width:"100%", height:190 }}>
          <canvas ref={canvasRef} />
        </div>
      );
    }

    // Group overview — grouped bars: target (ghost) + chanted (coloured) per person
    function GroupChart({ data, nameIndex }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !data.length) return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext("2d");
        chartRef.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: data.map(d => d.shortName),
            datasets: [
              {
                label: "Target",
                data: data.map(d => d.target),
                backgroundColor: "rgba(232,184,75,0.15)",
                borderRadius: 4,
                maxBarThickness: 40,
              },
              {
                label: "Chanted",
                data: data.map(d => d.total),
                backgroundColor: data.map(d => PALETTE[nameIndex(d.fullName) % PALETTE.length] + "DD"),
                borderRadius: 4,
                maxBarThickness: 40,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                labels: { color: "rgba(237,232,245,0.5)", font: { size: 11 }, boxWidth: 12 }
              },
              tooltip: {
                backgroundColor: "rgba(8,6,20,0.95)",
                titleColor: "rgba(232,184,75,0.8)",
                bodyColor: "#EDE8F5",
                borderColor: "rgba(232,184,75,0.3)",
                borderWidth: 1,
                callbacks: {
                  title: items => data[items[0].dataIndex].fullName,
                  label: ctx => `${ctx.dataset.label}: ${ctx.raw.toLocaleString()} mins`
                }
              }
            },
            scales: {
              x: {
                grid: { color: "rgba(255,255,255,0.05)" },
                ticks: { color: "rgba(237,232,245,0.5)", font: { size: 11 } }
              },
              y: {
                grid: { color: "rgba(255,255,255,0.05)" },
                ticks: { color: "rgba(237,232,245,0.5)", font: { size: 10 } },
                beginAtZero: true
              }
            }
          }
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [data]);

      return (
        <div style={{ position:"relative", width:"100%", height:260 }}>
          <canvas ref={canvasRef} />
        </div>
      );
    }

    // ═════════════════════════════════════════════════════════════════
    //  CSS
    // ═════════════════════════════════════════════════════════════════
    // ── Time-of-day theme ──────────────────────────────────────────
    const getTimeTheme = () => {
      const h = new Date().getHours();
      if (h >= 5  && h < 9)  return 'dawn';
      if (h >= 9  && h < 17) return 'day';
      if (h >= 17 && h < 20) return 'dusk';
      return 'night';
    };
    const TIME_THEMES = {
      dawn:  { bg1:'rgba(180,80,40,.22)',  bg2:'rgba(232,184,75,.18)', label:'🌅 Dawn — the world stirs',  accent:'#F5A623' },
      day:   { bg1:'rgba(94,155,191,.18)', bg2:'rgba(91,173,143,.12)', label:'☀️ Day — full momentum',      accent:'#5E9BBF' },
      dusk:  { bg1:'rgba(155,108,196,.22)',bg2:'rgba(232,184,75,.15)', label:'🌇 Dusk — turning inward',    accent:'#9B6CC4' },
      night: { bg1:'rgba(120,60,220,.22)', bg2:'rgba(232,184,75,.13)', label:'🌙 Night — deep daimoku',     accent:'#E8B84B' },
    };

        const CSS = `

      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

    // ═════════════════════════════════════════════════════════════════
    //  Screens
    // ═════════════════════════════════════════════════════════════════
    const NotConfigured = () => (
      <div className="screen">
        <span style={{fontSize:40}}>🪷</span>
        <div className="screen-title">Setup Required</div>
        <div className="not-conf">
          <strong style={{color:"#E8B84B"}}>One step needed before this works:</strong><br/><br/>
          1. Deploy <code>api.gs</code> as a Web App in Google Apps Script<br/>
          2. Copy the Web App URL<br/>
          3. Open <code>index.html</code>, replace <code>YOUR_APPS_SCRIPT_WEB_APP_URL_HERE</code><br/>
          4. Re-upload to GitHub<br/><br/>
          <span style={{color:"rgba(237,232,245,.4)",fontSize:11}}>See the Setup Guide for step-by-step instructions.</span>
        </div>
      </div>
    );

    // ═════════════════════════════════════════════════════════════════
    //  Main App
    // ═════════════════════════════════════════════════════════════════
    function DaimokuTracker() {
      const now = new Date();
      const [appState,       setAppState]       = useState("loading");
      const [names,          setNames]          = useState([]);
      const [entries,        setEntries]        = useState([]);
      const [lastUpdated,    setLastUpdated]    = useState(null);
      const [tab,            setTab]            = useState("track");
      const [form,           setForm]           = useState({name:"",date:todayStr(),count:""});
      const [errors,         setErrors]         = useState({});
      const [toast,          setToast]          = useState(null);
      const [submitting,     setSubmitting]     = useState(false);
      const [saving,         setSaving]         = useState(false);
      const [refreshing,     setRefreshing]     = useState(false);
      const [newName,        setNewName]        = useState("");
      const [viewYear,       setViewYear]       = useState(now.getFullYear());
      const [viewMonth,      setViewMonth]      = useState(now.getMonth());
      const [viewMode,       setViewMode]       = useState("mtd");
      const [expandedPerson, setExpandedPerson] = useState(null);
      const [detailTab,      setDetailTab]      = useState("chart");
      // Admin / campaign state
      const [adminUnlocked,  setAdminUnlocked]  = useState(false);
      const [adminPin,       setAdminPin]       = useState("");
      const [pinError,       setPinError]       = useState(false);
      const [campaigns,      setCampaigns]      = useState([]);
      const [campLabel,      setCampLabel]      = useState("");
      const [campDate,       setCampDate]       = useState("");
      const [campSaving,     setCampSaving]     = useState(false);
      const [campMsg,        setCampMsg]        = useState(null);
      const [challenges,     setChallenges]     = useState({}); // {name: 30|45|60}
      const [grExpanded,    setGrExpanded]    = useState(null);
      const [studyData,      setStudyData]      = useState([]);   // array of monthly study entries
      const [studyLoading,   setStudyLoading]   = useState(false);
      const [studyArchive,   setStudyArchive]   = useState(false); // show archive toggle
      // Admin study form
      const [studyForm,      setStudyForm]      = useState({
        month:"", accent:"gold", title:"", intro:"",
        bullets:"", quote:"", quoteAuthor:"— Daisaku Ikeda", reflection:""
      });
      const [studySaving,    setStudySaving]    = useState(false);
      const [studyMsg,       setStudyMsg]       = useState(null);
      const [timeTheme,      setTimeTheme]      = useState(getTimeTheme());
      const [confetti,       setConfetti]       = useState([]);
      const [dashKey,        setDashKey]        = useState(0); // remount animations on tab switch

      // Update time theme every minute
      useEffect(()=>{
        const t = setInterval(()=>setTimeTheme(getTimeTheme()), 60000);
        return ()=>clearTimeout(t);
      },[]);

      // Confetti burst
      const burstConfetti = () => {
        const dots = Array.from({length:18},(_,i)=>({
          id:Date.now()+i,
          left: Math.random()*100,
          color: ['#E8B84B','#5BAD8F','#9B6CC4','#5E9BBF','#E06B75'][i%5],
          size: 6+Math.random()*8,
          delay: Math.random()*0.6,
        }));
        setConfetti(dots);
        setTimeout(()=>setConfetti([]),2500);
      };
      const [grParable,      setGrParable]      = useState(false);
      const toastRef = useRef(null);
      const [theme, setTheme] = useState("afternoon");
      const [milestone, setMilestone] = useState(null);
      const [prevGroupPct, setPrevGroupPct] = useState(0);

      // Time of day theme
      useEffect(() => {
        const h = new Date().getHours();
        if (h >= 5  && h < 12) setTheme("morning");
        else if (h >= 12 && h < 17) setTheme("afternoon");
        else if (h >= 17 && h < 21) setTheme("evening");
        else setTheme("night");
      }, []);

      const themeLabel = {"morning":"🌅 Morning","afternoon":"☀️ Afternoon","evening":"🌆 Evening","night":"🌙 Night"}[theme]||"";

      // Entrance animations handled by pure CSS @keyframes — no JS needed

      // Milestone detection
      useEffect(() => {
        const gp = pct(totalMins, groupMtdTarget||1);
        if (prevGroupPct < 50  && gp >= 50)  setMilestone({pct:50,  msg:"Halfway there! The Law is moving. 🔥"});
        if (prevGroupPct < 75  && gp >= 75)  setMilestone({pct:75,  msg:"75% achieved — the Zadankai can feel it! 🪷"});
        if (prevGroupPct < 100 && gp >= 100) setMilestone({pct:100, msg:"District target reached! Nam-Myoho-Renge-Kyo! 🎉"});
        setPrevGroupPct(gp);
      }, [totalMins, groupMtdTarget]);

      const showToast = (msg, type="success") => {
        setToast({msg,type});
        clearTimeout(toastRef.current);
        toastRef.current = setTimeout(()=>setToast(null), 4000);
      };

      const loadData = useCallback(async (isRefresh=false) => {
        if (isRefresh) setRefreshing(true); else setAppState("loading");
        try {
          const d = await api.getData();
          if (!d.ok) throw new Error(d.error||"API returned error");
          setNames(d.names||[]);
          setEntries(d.entries||[]);
          setLastUpdated(new Date());
          setAppState("ready");
          // Load per-person challenges
          try {
            const ch = await api.getChallenges();
            if (ch.ok) setChallenges(ch.challenges||{});
          } catch(e) {}
          // Load study material
          try {
            const sd = await api.getStudy();
            if (sd.ok) setStudyData(sd.entries||[]);
          } catch(e) {}
          // Load campaign dates for dashboard
          try {
            const cd = await api.getCampaignDates();
            if (cd.ok) setCampaigns(cd.campaigns||[]);
          } catch(e) { console.log('Campaign load error:', e); }
        } catch(e) {
          if (!isRefresh) setAppState("error");
          else showToast("Refresh failed — "+e.message, "error");
        } finally {
          setRefreshing(false);
        }
      }, []);

      useEffect(()=>{
        if (API_URL==="YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") { setAppState("not-configured"); return; }
        loadData();
      },[]);

      const loadCampaigns = useCallback(async () => {
        try {
          const d = await api.getCampaignDates();
          if (d.ok) setCampaigns(d.campaigns||[]);
        } catch(e) {}
      }, []);

      useEffect(() => { if (adminUnlocked) loadCampaigns(); }, [adminUnlocked]);

      const handleAdminUnlock = () => {
        // PIN is verified server-side — just try a dummy call to check
        setPinError(false);
        // We'll verify on save; just unlock UI optimistically
        if (adminPin.trim() === "") { setPinError(true); return; }
        setAdminUnlocked(true);
        loadCampaigns();
      };

      const handleSetCampaignDate = async () => {
        if (!campLabel || !campDate) { setCampMsg({msg:"Select month and date",type:"error"}); return; }
        setCampSaving(true); setCampMsg(null);
        try {
          const r = await api.setCampaignDate(campLabel, campDate, adminPin);
          if (!r.ok) throw new Error(r.error||"Failed");
          setCampMsg({msg:"✅ Campaign start date updated: "+campLabel+" → "+campDate, type:"success"});
          loadCampaigns();
          setCampDate("");
        } catch(err) {
          if (err.message.includes("PIN")) { setAdminUnlocked(false); setPinError(true); }
          setCampMsg({msg:"Error: "+err.message, type:"error"});
        } finally { setCampSaving(false); }
      };

      // Generate next 12 month labels
      const monthOptions = Array.from({length:12},(_,i) => {
        const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
        return d.toLocaleString("en-US",{month:"long",year:"numeric"});
      });

      const handleSubmit = async () => {
        const e={};
        if (!form.name) e.name="Please select your name";
        if (!form.date) e.date="Please select a date";
        const n=Number(form.count);
        if (!form.count||!Number.isInteger(n)||n<=0) e.count="Enter a whole number greater than 0";
        if (Object.keys(e).length){setErrors(e);return;}
        setSubmitting(true);
        try {
          const personChallenge=challenges[form.name]||60;
          const r=await api.addEntry({name:form.name,date:form.date,count:parseInt(form.count),challenge:personChallenge});
          if (!r.ok) throw new Error(r.error||"Save failed");
          setEntries(prev=>[...prev,{id:r.id||Date.now(),name:form.name,date:form.date,count:parseInt(form.count),challenge:personChallenge}]);
          setForm({name:"",date:todayStr(),count:""});
          setErrors({});
          showToast(SUBMIT_MESSAGES[Math.floor(Math.random()*SUBMIT_MESSAGES.length)]);
          // Burst confetti if person just hit 100%
          setTimeout(()=>{
            const p = getPersonStats(form.name, names.indexOf(form.name));
            if (pct(p.total, p.target) >= 100) burstConfetti();
          }, 500);
        } catch(err){ showToast("Could not save — "+err.message,"error"); }
        finally { setSubmitting(false); }
      };

      const handleSaveNames = async newNames => {
        setNames(newNames); setSaving(true);
        try {
          const r=await api.saveNames(newNames);
          if (!r.ok) throw new Error(r.error||"Sync failed");
        } catch(err){ showToast("Names updated locally but failed to sync — "+err.message,"error"); }
        finally { setSaving(false); }
      };

      // Dashboard calculations
      const getPersonStats = useCallback((name,idx)=>{
        const color=PALETTE[idx%PALETTE.length];
        let mine,target,elapsed,campaignStart,firstEntryDate=null;

        // Personal target — use stored challenge, fall back to latest entry's challenge
        const allMine=entries.filter(e=>e.name===name);
        const latestEntry=[...allMine].sort((a,b)=>b.date.localeCompare(a.date))[0];
        const personalTarget=challenges[name]||(latestEntry&&[30,45,60].includes(latestEntry.challenge)?latestEntry.challenge:60);

        if (viewMode==="mtd"){
          campaignStart=getCampaignStart(campaigns,viewYear,viewMonth);
          elapsed=daysElapsedFromStart(campaignStart);
          mine=allMine.filter(e=>{
            const d=new Date(e.date+"T00:00:00");
            return d>=campaignStart && d.getFullYear()===viewYear && d.getMonth()===viewMonth;
          });
          target=elapsed*personalTarget;
        } else {
          // ALL TIME — record of what was done, no pledge target
          mine=allMine;
          if (mine.length>0){
            const sorted=[...mine].sort((a,b)=>a.date.localeCompare(b.date));
            firstEntryDate=new Date(sorted[0].date+"T00:00:00");
            firstEntryDate.setHours(0,0,0,0);
            const today=new Date(); today.setHours(0,0,0,0);
            elapsed=Math.floor((today-firstEntryDate)/86400000)+1;
          } else {
            elapsed=0;
          }
          target=0; // no target for all-time — pledge varies month to month
          campaignStart=firstEntryDate||new Date(0);
        }
        return {name,color,total:mine.reduce((s,e)=>s+e.count,0),target,elapsed,entries:mine,personalTarget,campaignStart,firstEntryDate};
      },[entries,viewYear,viewMonth,viewMode,campaigns,challenges]);

      const allPersonData=names.map((n,i)=>getPersonStats(n,i));
      const totalMins=allPersonData.reduce((s,p)=>s+p.total,0);
      const totalTarget=allPersonData.reduce((s,p)=>s+p.target,0);
      const onTrack=allPersonData.filter(p=>pct(p.total,p.target)>=80).length;
      // Weighted average daily pledge across all members
      const activeMembersCount=allPersonData.filter(p=>p.personalTarget>0).length||1;
      const weightedAvgPledge=Math.round(allPersonData.reduce((s,p)=>s+p.personalTarget,0)/activeMembersCount);
      // Group MTD target = sum of all individual targets
      const groupMtdTarget=totalTarget;
      const campStart=getCampaignStart(campaigns,viewYear,viewMonth);
      const elapsed=viewMode==="mtd"?daysElapsedFromStart(campStart):0; // all-time elapsed is per-person
      const isCurrent=viewYear===now.getFullYear()&&viewMonth===now.getMonth();

      const prevMonth=()=>{if(viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1);setExpandedPerson(null);};
      const nextMonth=()=>{if(isCurrent)return;if(viewMonth===11){setViewYear(y=>y+1);setViewMonth(0);}else setViewMonth(m=>m+1);setExpandedPerson(null);};

      const getDailyData=useCallback(pEntries=>{
        if (viewMode==="alltime"){
          const g={};pEntries.forEach(e=>{g[e.date]=(g[e.date]||0)+e.count;});
          return Object.entries(g).sort(([a],[b])=>a.localeCompare(b)).map(([date,mins])=>({day:fmtDate(date),mins}));
        }
        const g={};pEntries.forEach(e=>{g[e.date]=(g[e.date]||0)+e.count;});
        const cs=getCampaignStart(campaigns,viewYear,viewMonth);
        return Array.from({length:elapsed},(_,i)=>{
          const dd=new Date(cs); dd.setDate(dd.getDate()+i);
          const ds=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
          return {day:dd.getDate(),mins:g[ds]||0};
        });
      },[viewMode,viewYear,viewMonth,elapsed]);

      const nameIndex=useCallback(n=>names.indexOf(n),[names]);
      const groupChartData=allPersonData.map(p=>({shortName:p.name.split(" ")[0],fullName:p.name,total:p.total,target:p.target})).sort((a,b)=>b.total-a.total);

      // Render guards
      if (appState==="not-configured") return <NotConfigured />;
      if (appState==="loading") return (
        <div className="screen">
          <span className="spin">🪷</span>
          <div className="screen-title">Loading Daimoku Data</div>
          <div className="screen-sub">Connecting to your Google Sheet…</div>
        </div>
      );
      if (appState==="error") return (
        <div className="screen">
          <span style={{fontSize:36}}>⚠️</span>
          <div className="screen-title">Could Not Connect</div>
          <div className="err-box">Failed to reach the Apps Script API.<br/>Check that the Web App is deployed and the URL in index.html is correct.</div>
          <button className="retry-btn" onClick={()=>loadData()}>↻ Retry</button>
        </div>
      );

      return (
        <>
          <style>{CSS}</style>
          <div className="app" style={{
              background:`radial-gradient(ellipse at 15% 0%,${TIME_THEMES[timeTheme].bg1} 0%,transparent 52%),
                          radial-gradient(ellipse at 85% 90%,${TIME_THEMES[timeTheme].bg2} 0%,transparent 52%),#080614`
            }}>
            
            {/* Confetti */}
            {confetti.length>0&&(
              <div className="confetti-wrap">
                {confetti.map(d=>(
                  <div key={d.id} className="confetti-dot" style={{
                    left:`${d.left}%`, bottom:'-10px',
                    width:d.size, height:d.size,
                    background:d.color,
                    animationDelay:`${d.delay}s`,
                  }}/>
                ))}
              </div>
            )}

            <div className="hdr">
              <div className="lotus-row">
                <span className="lotus">🪷</span><span className="lotus">🪷</span><span className="lotus">🪷</span>
              </div>
              <h1>Daily Daimoku Tracker</h1>
              <p className="sub">Nam · Myoho · Renge · Kyo <span className="theme-tag">{themeLabel}</span></p>
              <div className="time-label" style={{color:TIME_THEMES[timeTheme].accent}}>
                {TIME_THEMES[timeTheme].label}
              </div>
              {(()=>{const dq=getDailyQuote();return(
                <div className="quote-box">
                  <p className="qt">{dq.text}</p>
                  <p className="qa">{dq.attr}</p>
                </div>
              );})()}

              {/* ── Intentions Banner — compact ── */}
              <div style={{maxWidth:660,margin:"0 auto 22px",padding:"11px 18px",
                background:"rgba(91,173,143,.07)",border:"1px solid rgba(91,173,143,.22)",
                borderRadius:10,textAlign:"center"}}>
                <div style={{fontSize:10,letterSpacing:".2em",color:"#5BAD8F",
                  textTransform:"uppercase",marginBottom:7,fontFamily:"'Cinzel',serif"}}>
                  🙏 Chanting For — May Zadankai
                </div>
                <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:"6px 12px"}}>
                  {["🌟 25 members","💬 5 experiences","🤝 5 new members","🛡️ Safe gathering",
                    "🎙️ Seamless flow","🌍 World peace",
                    "🌿 Nature","🕊️ An undefeated world"].map(t=>(
                    <span key={t} style={{fontSize:11,color:"rgba(237,232,245,.6)",
                      background:"rgba(255,255,255,.04)",borderRadius:20,
                      padding:"3px 10px",border:"1px solid rgba(255,255,255,.07)"}}>
                      {t}
                    </span>
                  ))}
                </div>
                <div style={{marginTop:8,fontSize:10,color:"rgba(91,173,143,.6)",fontStyle:"italic"}}>
                  60 · 45 · 30 mins — every minute counts. 🔥
                </div>
              </div>

                                value={studyForm.quote} onChange={e=>setStudyForm(f=>({...f,quote:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Quote Attribution</label>
                              <input className="fi" type="text" placeholder="— Daisaku Ikeda"
                                value={studyForm.quoteAuthor} onChange={e=>setStudyForm(f=>({...f,quoteAuthor:e.target.value}))}/>
                            </div>
                            <div className="fl">
                              <label>Reflection Question</label>
                              <textarea className="study-textarea" style={{minHeight:70}}
                                placeholder="A question for members to sit with..."
                                value={studyForm.reflection} onChange={e=>setStudyForm(f=>({...f,reflection:e.target.value}))}/>
                            </div>
                            <button className="sbtn" disabled={studySaving} onClick={async()=>{
                              if (!studyForm.month||!studyForm.title){setStudyMsg({msg:"Month and title required",type:"error"});return;}
                              setStudySaving(true);setStudyMsg(null);
                              try {
                                const r=await api.saveStudy(studyForm);
                                if (!r.ok) throw new Error(r.error||"Save failed");
                                setStudyData(prev=>[...prev.filter(s=>s.month!==studyForm.month),{...studyForm}]
                                  .sort((a,b)=>new Date("1 "+a.month)-new Date("1 "+b.month)));
                                setStudyMsg({msg:"✅ Study material saved for "+studyForm.month,type:"success"});
                                setStudyForm(f=>({...f,title:"",intro:"",bullets:"",quote:"",quoteAuthor:"— Daisaku Ikeda",reflection:""}));
                              } catch(err){setStudyMsg({msg:"Error: "+err.message,type:"error"});}
                              finally{setStudySaving(false);}
                            }}>{studySaving?"Saving…":"Save Study Material"}</button>
                            {studyMsg&&<div className={"toast "+studyMsg.type}>{studyMsg.msg}</div>}
                          </div>
                        </>
                      )}
                    </>
                  )}
                </div>
              )}

            </div>
            {saving&&<div className="save-overlay"><span className="spin" style={{fontSize:14}}>🪷</span> Syncing…</div>}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<DaimokuTracker />);
  </script>
</body>
</html>
